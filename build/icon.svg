<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 拆片工坊：一条胶片从中间剪开，上面一把剪刀。深青底 + 珊瑚色胶片 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F5A66"/>
      <stop offset="1" stop-color="#082F38"/>
    </linearGradient>
    <g id="strip">
      <rect x="0" y="0" width="330" height="230" rx="18" fill="#FF7A59"/>
      <rect x="22" y="56" width="132" height="118" rx="10" fill="#FFD9CB"/>
      <rect x="176" y="56" width="132" height="118" rx="10" fill="#FFD9CB"/>
      <g fill="#0B3F49">
        <rect x="18" y="16" width="30" height="22" rx="6"/><rect x="78" y="16" width="30" height="22" rx="6"/>
        <rect x="138" y="16" width="30" height="22" rx="6"/><rect x="198" y="16" width="30" height="22" rx="6"/>
        <rect x="258" y="16" width="30" height="22" rx="6"/>
        <rect x="18" y="192" width="30" height="22" rx="6"/><rect x="78" y="192" width="30" height="22" rx="6"/>
        <rect x="138" y="192" width="30" height="22" rx="6"/><rect x="198" y="192" width="30" height="22" rx="6"/>
        <rect x="258" y="192" width="30" height="22" rx="6"/>
      </g>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="rotate(-14 512 600)">
    <use href="#strip" transform="translate(132 500)"/>
    <use href="#strip" transform="translate(562 518)"/>
  </g>
  <!-- 剪刀：刀尖朝下对着断口 -->
  <g transform="translate(508 330)" fill="none" stroke="#F7F1E6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-74" cy="-150" r="58" stroke-width="34"/>
    <circle cx="74" cy="-150" r="58" stroke-width="34"/>
    <path d="M-44 -100 L60 150" stroke-width="40"/>
    <path d="M44 -100 L-60 150" stroke-width="40"/>
    <circle cx="0" cy="6" r="14" fill="#F7F1E6" stroke="none"/>
  </g>
</svg>
